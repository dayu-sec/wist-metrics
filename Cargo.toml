[package]
name = "wist-metrics"
version = "0.20.2" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "Metrics collection contract and provider abstractions for the wist ecosystem"
repository = "https://github.com/dayu-sec/wist-metrics"
homepage = "https://github.com/dayu-sec/wist-metrics"
documentation = "https://docs.rs/wist-metrics"
readme = "README.md"
keywords = ["wist", "metrics", "telemetry", "observability"]
categories = ["development-tools", "config"]

[lib]
path = "src/lib.rs"

[dependencies]
jumo-derive = "0.1"
serde = { version = "1.0", features = ["derive"] }
wist-contracts = { version = "0.14" }
# 本地联调：切 path（整条链一起切，见 rust-gx/local-dev-and-publishing）
#wist-contracts = { version = "0.13", path = "../wist-contracts" }

[dev-dependencies]
serde_json = "1.0"

[patch.crates-io]
# 2026-11-22：contracts 0.14.0 / api 0.13.2 已上 crates.io，patch 保持注释；
# 留着会让 CI 报 `patch location ... does not contain packages`（siblings 在 CI 上不存在）。
# E0（`ActionPlanStep.args`）：contracts 0.13 尚未发布，本地联调走 path。
# 发布完成后注释回去。
# wist-contracts = { path = "../wist-contracts" }
