[package]
name = "wist-metrics"
version = "0.1.2"  #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["wist Dev Team"]
description = "Metrics collection contract and provider abstractions for the wist ecosystem"
repository = "https://github.com/dayu-sec/wist-metrics"
homepage = "https://github.com/dayu-sec/wist-metrics"
documentation = "https://docs.rs/wist-metrics"
readme = "README.md"
keywords = ["wist", "metrics", "telemetry", "observability"]
categories = ["development-tools", "config"]

[lib]
path = "src/lib.rs"

[dependencies]
jumo-derive = "0.1"
serde = { version = "1.0", features = ["derive"] }
# NOTE(local-dev): 随 agentd 一起切到本地 path（必须整条链一致，否则会出两份 wist-contracts）。
wist-contracts = { version = "0.1.1", path = "../wist-contracts" }
#wist-contracts = { version = "0.1"  }
